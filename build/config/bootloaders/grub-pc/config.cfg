# EclipseOS GRUB settings (original configuration, GPL-3.0-or-later).
# Sourced by grub.cfg before the menu is drawn.
#
# Keep the automatic boot short but visible: the live image boots unattended in
# the QEMU tests, and a human user still sees which entry is about to run.

set default=0
set timeout=10
set timeout_style=menu

# The EclipseOS GRUB font is copied next to this file by scripts/build.sh from
# the build host's grub-common package, so the theme renders identically on the
# BIOS and UEFI boot paths.
if loadfont /boot/grub/unicode.pf2 ; then
	set gfxmode=1024x768,800x600,auto
	set gfxpayload=keep

	insmod all_video

	if [ "${grub_platform}" = "efi" ]; then
		insmod efi_gop
		insmod efi_uga
	fi

	insmod gfxterm
	insmod png

	source /boot/grub/theme.cfg

	terminal_output gfxterm
else
	set gfxmode=auto

	insmod all_video
	insmod png

	source /boot/grub/theme.cfg

	insmod gfxterm
	terminal_output gfxterm
fi

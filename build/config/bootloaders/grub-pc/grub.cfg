# EclipseOS GRUB menu (original configuration, GPL-3.0-or-later).
#
# live-build copies this file to /boot/grub/grub.cfg and replaces the
# live-entry marker below with the menu entries generated from auto/config.
# Both the BIOS (El Torito) and the UEFI (shim -> GRUB) boot paths source it.
#
# The menu must never wait for input: the automated QEMU boot tests do not send
# keystrokes, and config.cfg sets an explicit timeout.

source /boot/grub/config.cfg

# Live system entries (generated)
@LINUX_LIVE@

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Firmware setup (UEFI only)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums of the live medium
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}

# EclipseOS live-session fallback resolver configuration.
#
# This static file exists so that the image never ships the build host's
# resolver configuration (live-build's chroot preparation would otherwise
# restore it) and so that name resolution works before a network connection
# is activated.
#
# NetworkManager replaces the contents of this file with the servers supplied
# by DHCP, PPP or a static connection profile as soon as a connection is up.
# These public resolvers are a fallback only; no queries are sent to them
# while a DHCP-provided resolver is configured.
nameserver 1.1.1.1
nameserver 9.9.9.9

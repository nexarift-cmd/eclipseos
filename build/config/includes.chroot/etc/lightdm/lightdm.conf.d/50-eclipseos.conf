# EclipseOS LightDM seat configuration (Phase 1).
#
# The live account "eclipse" has no password and is logged in automatically.
# The Phase 3 installer replaces this with the Calamares/SDDM setup for the
# installed system; do not copy this file there.
[Seat:*]
autologin-user=eclipse
autologin-user-timeout=0
autologin-session=eclipseos
user-session=eclipseos
greeter-session=lightdm-gtk-greeter
allow-guest=false

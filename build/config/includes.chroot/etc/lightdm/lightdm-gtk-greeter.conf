[greeter]
theme-name = Adwaita
icon-theme-name = Adwaita
font-name = Inter 11
xft-antialias = true
xft-hintstyle = hintslight
background = /usr/share/backgrounds/eclipseos/eclipseos-wallpaper-1920x1080.png
user-background = false
clock-format = %H:%M
indicators = ~host;~spacer;~clock;~spacer;~session;~power
default-user-image = /usr/share/pixmaps/eclipseos/eclipseos-mark-256.png

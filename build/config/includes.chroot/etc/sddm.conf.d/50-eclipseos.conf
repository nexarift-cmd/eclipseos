[Autologin]
User=eclipse
# Safe fallback. eclipseos-session.service writes a later drop-in that selects
# the Wayland session on physical machines and X11 on virtual machines.
Session=eclipseos-x11
Relogin=false

[General]
DisplayServer=x11
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot

[Theme]
Current=eclipseos

[Users]
MaximumUid=60000
MinimumUid=1000
